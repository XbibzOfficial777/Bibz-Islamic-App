name: quranx
description: "Bibz Islamic — offline-first Quran application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  url_launcher_android: 6.3.31

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/bibz_islamic_logo.png
