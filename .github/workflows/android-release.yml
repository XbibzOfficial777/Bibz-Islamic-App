name: Android Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  build:
    name: Build Android APKs
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter Android compatibility
        run: flutter analyze --suggestions

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks
          EOF

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build universal APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Explicitly sign APKs with V2, V3, and V4
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            signed_apk="${apk%.apk}.signed.apk"
            rm -f "$signed_apk" "$signed_apk.idsig" "$apk.idsig"
            "$APKSIGNER" sign \
              --ks android/upload-keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$signed_apk" \
              "$apk"
            mv "$signed_apk" "$apk"
            mv "$signed_apk.idsig" "$apk.idsig"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            test -s "$apk.idsig"
            printf 'V4 idsig generated: %s\\n' "$apk.idsig"
          done

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/quranx-armv7-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk.idsig dist/quranx-armv7-release.apk.idsig
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/quranx-arm64-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.idsig dist/quranx-arm64-release.apk.idsig
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/quranx-x86_64-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk.idsig dist/quranx-x86_64-release.apk.idsig
          cp build/app/outputs/flutter-apk/app-release.apk dist/quranx-universal-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk.idsig dist/quranx-universal-release.apk.idsig
          sha256sum dist/*.apk dist/*.idsig > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quranx-apks-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: quranx-apks-${{ github.sha }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: QuranX ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/quranx-armv7-release.apk
            dist/quranx-arm64-release.apk
            dist/quranx-x86_64-release.apk
            dist/quranx-universal-release.apk
            dist/quranx-armv7-release.apk.idsig
            dist/quranx-arm64-release.apk.idsig
            dist/quranx-x86_64-release.apk.idsig
            dist/quranx-universal-release.apk.idsig
            dist/SHA256SUMS.txt
