name: Android Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  build:
    name: Build Android APKs
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter Android compatibility
        run: flutter analyze --suggestions

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build universal APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/bibz-islamic-armv7-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/bibz-islamic-arm64-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/bibz-islamic-x86_64-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/bibz-islamic-universal-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibz-islamic-apks-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: bibz-islamic-apks-${{ github.sha }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Bibz Islamic ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/bibz-islamic-armv7-release.apk
            dist/bibz-islamic-arm64-release.apk
            dist/bibz-islamic-x86_64-release.apk
            dist/bibz-islamic-universal-release.apk
            dist/SHA256SUMS.txt
